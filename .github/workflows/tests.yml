name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Tests con cobertura
        run: dotnet test backend/DevAtlas.Api.Tests --collect:"XPlat Code Coverage" --results-directory ./cobertura
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: cobertura/**/coverage.cobertura.xml
